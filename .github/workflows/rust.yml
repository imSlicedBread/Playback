name: Rust migration checks

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migration and persistence tests
        run: cargo test --workspace --locked
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Build the migration CLI
        run: cargo build --release --locked -p playback-cli
      - name: Compare queue behavior with the existing JavaScript engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PLAYBACK_RUST_BIN="$PWD/target/release/playback.exe"
          else
            export PLAYBACK_RUST_BIN="$PWD/target/release/playback"
          fi
          node verification/node-parity.mjs

