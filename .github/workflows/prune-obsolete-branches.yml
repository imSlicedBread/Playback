name: Prune obsolete Playback branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'imSlicedBread/Playback'
    runs-on: ubuntu-latest
    steps:
      - name: Verify refs and remove two obsolete branches
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [
              ['performance/control-panel-v1.2.4', 'a70314efdc2feca2c8fe253223b67a178bd9e2d0'],
              ['build/storage-v1.3.0', '8c1f4da9c6cdc0052f52471a2c86cc5b366b15be']
            ];
            const {owner,repo} = context.repo;
            for (const [branch,sha] of expected) {
              const ref = `heads/${branch}`;
              const response = await github.rest.git.getRef({owner,repo,ref});
              if (response.data.object.sha !== sha) {
                throw new Error(`Ref changed unexpectedly: ${branch}`);
              }
            }
            for (const [branch] of expected) {
              await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`});
              core.info(`Deleted ${branch}`);
            }
            core.info('Kept main and all release tags.');
