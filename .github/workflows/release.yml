name: Playback CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '22.13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Download verified prebundled yt-dlp (Windows)
        if: matrix.os == 'windows-latest'
        run: python ops/bundle-yt-dlp.py
      - name: Test bundled yt-dlp on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\tools\yt-dlp.exe --version

  release:
    name: Package and release version
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official yt-dlp executable and notices (SHA-256 verified)
        run: python3 ops/bundle-yt-dlp.py
      - name: Package reproducible archive (requires prebundled yt-dlp)
        run: python3 ops/package-release.py --require-yt-dlp
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace its assets."
            exit 0
          fi
          gh release create "$TAG" "dist/Playback-${TAG}.zip" "dist/Playback-${TAG}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "fKey Playback ${TAG} — Kick and SOOP admin chat" \
            --notes-file RELEASE_NOTES.md