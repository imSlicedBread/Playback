<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fKey Playback — Viewer Voting</title><link rel="stylesheet" href="/assets/style.css"></head><body><main style="max-width:1200px"><div class="headline"><div><div class="eyebrow">made by fKey Labs Inc.</div><h1><span class="keycap" style="vertical-align:middle;margin-right:12px">f</span> fKey Playback Vote_</h1><p>Vote for the next video and suggest videos for the operator.</p></div><a href="/control" class="btn">Station Control ↗</a></div><section class="panel stack"><div class="panel-header"><h2>NOW PLAYING</h2><span id="nowStatus" class="eyebrow">OFFLINE</span></div><div id="nowTitle">—</div><div id="skipSection" class="inline"><button id="skipVote">Vote to Skip</button><span id="skipReadout" class="small-note"></span></div><p id="voteMessage" class="notice" aria-live="polite"></p></section><section class="panel stack" style="margin-top:20px"><div class="panel-header"><h2>UP NEXT / COMMUNITY VOTE</h2><span id="countdown" class="eyebrow">INACTIVE</span></div><div id="choices" class="grid equal"></div></section><section class="panel stack" style="margin-top:20px"><h2>SUGGEST A YOUTUBE VIDEO</h2><form id="suggestForm" class="stack"><label>Video link<input id="suggestUrl" required placeholder="https://youtu.be/..."></label><label>Title (optional)<input id="suggestTitle" maxlength="180"></label><button type="submit" class="primary">Submit for Operator Review</button></form><p id="suggestMessage" class="notice" aria-live="polite"></p></section></main><script type="module" src="/assets/vote.js"></script></body></html>
